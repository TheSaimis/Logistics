<div class="login-wrap">
  <div class="login-card card">
    <div class="brand">
      <span class="brand-icon">📦</span>
      <h1>Logistics IMS</h1>
      <p class="muted">Inventory management system</p>
    </div>

    <form (ngSubmit)="submit()">
      @if (mode() === 'register') {
        <div class="form-field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" [(ngModel)]="fullName" required autocomplete="name" />
        </div>
      }

      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required autocomplete="email" />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required
               autocomplete="current-password" />
      </div>

      @if (error()) {
        <div class="form-error">{{ error() }}</div>
      }

      <button class="btn btn-block" type="submit" [disabled]="loading()">
        {{ mode() === 'login' ? 'Sign in' : 'Create account' }}
      </button>
    </form>

    <div class="divider"><span>or</span></div>

    <a class="btn btn-outline btn-block google" [href]="googleUrl">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </a>

    <p class="switch muted">
      {{ mode() === 'login' ? "Don't have an account?" : 'Already registered?' }}
      <a href="javascript:void(0)" (click)="toggleMode()">
        {{ mode() === 'login' ? 'Create one' : 'Sign in' }}
      </a>
    </p>
  </div>
</div>
