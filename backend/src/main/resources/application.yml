spring:
  # Local development is the default; set SPRING_PROFILES_ACTIVE=prod in production.
  # Outside 'dev', startup fails unless JWT_SECRET is overridden (SecurityStartupCheck)
  # and demo users are not seeded.
  profiles:
    default: dev
  application:
    name: logistics-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logistics}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-not-configured}
            scope:
              - email
              - profile

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    # Override in production: at least 64 random bytes, base64-encoded
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi1wbGVhc2UtMTIzNDU2Nzg5MA==}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  oauth2:
    # Where the OAuth2 success handler redirects with tokens
    frontend-redirect: ${OAUTH2_REDIRECT:http://localhost:4200/auth/callback}

management:
  endpoints:
    web:
      exposure:
        include: health,info
